<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recibos y gastos</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f4f1; --surface:#fcfcfb; --surface-2:#f0efec; --border:#e4e3de;
  --text:#0b0b0b; --text-2:#52514e; --muted:#8a8984; --grid:#e9e8e3;
  --accent:#2a78d6; --accent-soft:#e3eefb;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#2e2e2b;
    --text:#f0efec; --text-2:#c3c2b7; --muted:#8f8e86; --grid:#2c2c29;
    --accent:#3987e5; --accent-soft:#1d2c40;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
/* Sidebar */
.side{background:var(--surface);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px}
.brand h1{font-size:16px;margin:0;font-weight:650}
.brand small{display:block;color:var(--muted);font-size:12px}
.navgroup{margin-top:14px}
.navgroup h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 8px 6px;font-weight:600;display:flex;align-items:center;gap:6px}
.navgroup h3 i{width:8px;height:8px;border-radius:50%;display:inline-block}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;color:var(--text-2);text-decoration:none;font-size:14px}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--text);font-weight:600}
.nav a .ic{width:22px;text-align:center}
.nav a .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a .am{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav a.home{margin-bottom:4px}
/* Main */
main{padding:28px 32px 60px;min-width:0;max-width:1240px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h2{font-size:26px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.top .sub{color:var(--text-2);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.chip i{width:7px;height:7px;border-radius:50%}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.live .dot{background:#0ca30c}
button.btn{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer}
button.btn:hover{background:var(--surface-2)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--text-2);padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow);font-weight:600}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:var(--shadow);min-width:0}
.kpi .lbl{font-size:13px;color:var(--text-2)}
.kpi .val{font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .foot{font-size:12px;color:var(--muted);margin-top:4px}
.card h4{margin:0 0 12px;font-size:15px;font-weight:650;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h4 span{font-size:12px;color:var(--muted);font-weight:400}
.two{grid-template-columns:1.4fr 1fr;margin-bottom:16px}
.full{margin-bottom:16px}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--muted);font-size:11px}
.gridline{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--border);stroke-width:1}
.bar{transition:opacity .12s}
.chart.hovering .bar:not(.hl){opacity:.35}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px}
/* hbars */
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:6px 10px;align-items:center;font-size:13px}
.hb .n{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .n a{color:inherit;text-decoration:none}
.hb .n a:hover{color:var(--text);text-decoration:underline}
.hb .t{height:14px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hb .f{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb .v{font-variant-numeric:tabular-nums;color:var(--text);text-align:right;font-weight:550}
/* lists */
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--border)}
.list .it:first-child{border-top:0}
.list .ic{width:34px;height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;flex:none}
.list .tx{flex:1;min-width:0}
.list .tx b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .tx small{color:var(--muted);font-size:12px}
.list .am{font-weight:650;font-variant-numeric:tabular-nums}
.list a{color:inherit;text-decoration:none}
/* table */
.tbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tbar input{font:inherit;font-size:14px;padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);min-width:220px}
.tw{overflow:auto;border-radius:10px;border:1px solid var(--border);max-height:560px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
td.wrap{white-space:normal;min-width:220px}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;color:var(--text-2);font-size:12px;text-transform:uppercase;letter-spacing:.04em;z-index:1}
td.num{text-align:right;font-variant-numeric:tabular-nums}
th.num{text-align:right}
td.amt{font-weight:650}
tbody tr:hover{background:var(--surface-2)}
tr.future td{color:var(--muted)}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;font-weight:600}
.delta{font-size:12px;color:var(--text-2)}
.progress{height:12px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.progress>div{height:100%;background:var(--s1);border-radius:99px}
.prow{display:flex;justify-content:space-between;font-size:12px;color:var(--text-2)}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center}
#tip{position:fixed;pointer-events:none;z-index:50;background:var(--text);color:var(--surface);font-size:12px;padding:7px 10px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.18);opacity:0;transition:opacity .1s;max-width:260px}
#tip b{font-size:13px}
.notice{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--text-2);margin-bottom:16px}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:10;padding:12px 10px 8px;border-right:0;border-bottom:1px solid var(--border)}
  .brand{padding:0 6px 10px}
  .navwrap{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .navgroup{margin:0;display:contents}
  .navgroup h3{display:none}
  .nav a{white-space:nowrap;border:1px solid var(--border);padding:6px 10px}
  .nav a .am{display:none}
  .nav a .nm{overflow:visible}
  main{padding:20px 16px 50px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi .val{font-size:22px}
  .card{padding:14px}
  .kpi[style*="grid-column"]{grid-column:1/-1}
  .two{grid-template-columns:1fr}
  .top h2{font-size:22px}
}
</style>
</head>

function toISO(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return isoLocal(v);
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*864e5);return d.toISOString().slice(0,10)}

function num(v){

  const meta={};let freq=null;
  for(let r=0;r<hi;r++){const row=rows[r];
    for(let i=0;i<row.length;i++){const c=row[i];
      if(typeof c==='string'&&c.trim()){
        let j=i+1;while(j<row.length&&row[j]==null)j++;
        if(j<row.length&&typeof row[j]==='number'){meta[c.trim()]=row[j];i=j}
        else if(!freq&&!/media/i.test(c))freq=c.trim();
      }}}
  const amtIdx=(()=>{let i=cols.findIndex(c=>/^(precio|importe|cuota|total)$/i.test(c));if(i<0)i=cols.findIndex(c=>/precio|importe|cuota/i.test(c));return i<0?1:i})();
  const dateCols=cols.map(c=>/fecha/i.test(c));
  const recs=[];
  for(let r=hi+1;r<rows.length;r++){
    const cells=cols.map((_,k)=>rows[r][first+k]??null);
    const date=toISO(cells[0]);if(!date)continue;
    cells.forEach((v,k)=>{if(dateCols[k])cells[k]=toISO(v)||v});
    recs.push({date,amount:num(cells[amtIdx])??0,cells});
  }
  recs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const consIdx=cols.findIndex(c=>/^consumo/i.test(c));
  return {name,id:slug(name),cols,amtIdx,consIdx,meta,freq,recs,
    group:groupOf(name),icon:iconOf(name),place:placeOf(name),
    isMortgage:cols.some(c=>/capital pendiente/i.test(c))};
}
function stats(s){
  const past=s.recs.filter(r=>r.date<=TODAY),future=s.recs.filter(r=>r.date>TODAY);
  const from=addDays(TODAY,-365);
  const last12=past.filter(r=>r.date>from);
  const sum12=last12.reduce((a,r)=>a+r.amount,0);
  const last=past[past.length-1]||null,prev=past[past.length-2]||null;
  const byYear={};past.forEach(r=>{const y=r.date.slice(0,4);byYear[y]=(byYear[y]||0)+r.amount});
  return {past,future,last12,sum12,monthly:sum12/12,last,prev,next:future[0]||null,byYear,
    total:past.reduce((a,r)=>a+r.amount,0)};
}

const tip=document.getElementById('tip');
function showTip(html,e){tip.innerHTML=html;tip.style.opacity=1;
  const w=tip.offsetWidth,h=tip.offsetHeight;let x=e.clientX+14,y=e.clientY-h-12;

/* ---------------- Gráficos SVG ---------------- */
function niceTicks(min,max,count=4){
  if(min===max){max=min+1}
  const raw=(max-min)/count,mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=raw);
  const t=[];for(let v=Math.floor(min/step)*step;v<=Math.ceil(max/step)*step+1e-9;v+=step)t.push(+v.toFixed(10));
  return t;
}
function barPath(x,w,y0,y1){const h=Math.abs(y0-y1),r=Math.min(4,w/2,h);
  if(h<0.5)return '';
  if(y1<=y0)return `M${x},${y0}V${y1+r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+r}V${y0}Z`;
  return `M${x},${y0}V${y1-r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1-r}V${y0}Z`;}

function barChart(el,pts,{height=230,color='var(--s1)',xtick=null,fmtY=eur0.format}={}){
  const W=Math.max(el.clientWidth||600,300),H=height,m={t:10,r:6,b:26,l:58};
  const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const vals=pts.map(p=>p.value);const ticks=niceTicks(Math.min(0,...vals),Math.max(0,...vals));
  const lo=ticks[0],hi=ticks[ticks.length-1];const y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  const n=pts.length,step=iw/n,bw=Math.max(1.5,Math.min(34,step-2));
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s+=`<g class="axis">`+ticks.map(t=>`<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}"/><text x="${m.l-8}" y="${y(t)+4}" text-anchor="end">${fmtY(t)}</text>`).join('')+`</g>`;
  pts.forEach((p,i)=>{const x=m.l+i*step+(step-bw)/2;
    s+=`<path class="bar" data-i="${i}" fill="${p.color||color}" d="${barPath(x,bw,y(0),y(p.value))}"/>`;
    const lab=xtick?xtick(p,i):null;
    if(lab)s+=`<text class="axis" x="${m.l+i*step+step/2}" y="${H-8}" text-anchor="middle" style="fill:var(--muted);font-size:11px">${esc(lab)}</text>`;
  });
  s+=`<line class="base" x1="${m.l}" x2="${W-m.r}" y1="${y(0)}" y2="${y(0)}"/>`;
  pts.forEach((p,i)=>{s+=`<rect class="hit" data-i="${i}" x="${m.l+i*step}" y="${m.t}" width="${step}" height="${ih}" fill="transparent"/>`});
  s+='</svg>';el.innerHTML=s;
  const bars=el.querySelectorAll('.bar');
  el.querySelectorAll('.hit').forEach(h=>{
    h.addEventListener('pointermove',e=>{const i=+h.dataset.i;el.classList.add('hovering');bars.forEach(b=>b.classList.toggle('hl',+b.dataset.i===i));showTip(pts[i].tip,e)});
    h.addEventListener('pointerleave',()=>{el.classList.remove('hovering');bars.forEach(b=>b.classList.remove('hl'));hideTip()});
  });
}

function lineChart(el,pts,{height=230,color='var(--s1)',fmtY=eur0.format,fmtTip,split=null,zero=true}={}){
  if(pts.length<2){el.innerHTML='<div class="empty">No hay suficientes datos</div>';return}
  const W=Math.max(el.clientWidth||600,300),H=height,m={t:12,r:10,b:26,l:62};
  const iw=W-m.l-m.r,ih=H-m.t-m.b;
  const tx=p=>new Date(p.x+'T12:00:00').getTime();
  const x0=tx(pts[0]),x1=tx(pts[pts.length-1]);
  const vals=pts.map(p=>p.y);const ticks=niceTicks(zero?Math.min(0,...vals):Math.min(...vals),Math.max(...vals));
  const lo=ticks[0],hi=ticks[ticks.length-1];
  const X=t=>m.l+(t-x0)/(x1-x0||1)*iw,Y=v=>m.t+ih-(v-lo)/(hi-lo)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  s+=`<g class="axis">`+ticks.map(t=>`<line class="gridline" x1="${m.l}" x2="${W-m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l-8}" y="${Y(t)+4}" text-anchor="end">${fmtY(t)}</text>`).join('');
  const y0=+pts[0].x.slice(0,4),y1=+pts[pts.length-1].x.slice(0,4);const ys=[];for(let yy=y0;yy<=y1+1;yy++)ys.push(yy);
  const every=Math.ceil(ys.length/8);
  ys.forEach((yy,k)=>{const t=new Date(yy+'-01-01T12:00:00').getTime();if(t<x0||t>x1||k%every)return;s+=`<text x="${X(t)}" y="${H-8}" text-anchor="middle">${yy}</text>`});
  s+='</g>';
  const P=pts.map(p=>[X(tx(p)),Y(p.y)]);
  const d=arr=>arr.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join('');
  let si=split?pts.findIndex(p=>p.x>split):-1;
  const A=si>0?P.slice(0,si+1):P,B=si>0?P.slice(si):[];
  s+=`<path d="${d(A)}L${A[A.length-1][0]},${Y(lo)}L${A[0][0]},${Y(lo)}Z" fill="${color}" opacity=".10"/>`;
  s+=`<path d="${d(A)}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  if(B.length)s+=`<path d="${d(B)}" fill="none" stroke="${color}" stroke-width="2" stroke-dasharray="4 4" opacity=".6"/>`;
  if(split&&si>0){const xt=X(new Date(split+'T12:00:00').getTime());s+=`<line x1="${xt}" x2="${xt}" y1="${m.t}" y2="${m.t+ih}" stroke="var(--text-2)" stroke-dasharray="2 3"/><text x="${xt+4}" y="${m.t+10}" style="fill:var(--text-2);font-size:11px">hoy</text>`}
  s+=`<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" stroke="var(--muted)" opacity="0"/><circle class="mk" r="5" fill="${color}" stroke="var(--surface)" stroke-width="2" opacity="0"/>`;
  s+=`<rect class="hitarea" x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  el.innerHTML=s;
  const svg=el.querySelector('svg'),xh=el.querySelector('.xh'),mk=el.querySelector('.mk');
  const area=el.querySelector('.hitarea');
  area.addEventListener('pointermove',e=>{
    const r=svg.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width);
    let bi=0,bd=1e9;P.forEach((q,i)=>{const dd=Math.abs(q[0]-mx);if(dd<bd){bd=dd;bi=i}});
    const q=P[bi];xh.setAttribute('x1',q[0]);xh.setAttribute('x2',q[0]);xh.setAttribute('opacity',.6);
    mk.setAttribute('cx',q[0]);mk.setAttribute('cy',q[1]);mk.setAttribute('opacity',1);
    showTip(fmtTip?fmtTip(pts[bi]):`${fdate(pts[bi].x)}<br><b>${eur.format(pts[bi].y)}</b>`,e)});
  area.addEventListener('pointerleave',()=>{xh.setAttribute('opacity',0);mk.setAttribute('opacity',0);hideTip()});
}

function hbars(items,{fmt=eur.format}={}){
  if(!items.length)return '<div class="empty">Sin datos</div>';
  const max=Math.max(...items.map(i=>Math.abs(i.value)))||1;
  return `<div class="hb">`+items.map(i=>`<div class="n" title="${esc(i.label)}">${i.href?`<a href="${i.href}">${esc(i.label)}</a>`:esc(i.label)}</div><div class="t"><div class="f" style="width:${Math.abs(i.value)/max*100}%;background:${i.color||'var(--s1)'}"></div></div><div class="v">${fmt(i.value)}</div>`).join('')+`</div>`;
}

  <div class="grid kpis">${kpis}</div>
  ${s.isMortgage?`<div class="card full"><h4>Capital pendiente <span>Línea discontinua: cuotas futuras</span></h4><div class="chart" id="c1"></div></div>`
   :st.past.length>1?`<div class="grid ${years.length>1?'two':''}" style="margin-bottom:16px"><div class="card"><h4>Importe de cada recibo <span>${st.past.length} recibos</span></h4><div class="chart" id="c1"></div></div>
     ${years.length>1?`<div class="card"><h4>Total por año</h4><div class="chart" id="c2"></div></div>`:''}</div>`:''}
  ${s.consIdx>=0&&st.past.filter(r=>num(r.cells[s.consIdx])!=null).length>1?`<div class="card full"><h4>Consumo <span>${esc(s.cols[s.consIdx])}</span></h4><div class="chart" id="c3"></div></div>`:''}
  ${breakdowns.map((b,k)=>`<div class="card full"><h4>Por ${esc(b.c.toLowerCase())} <span>Total registrado</span></h4>${hbars(b.entries.sort((a,b)=>b[1]-a[1]).map(([l,v])=>({label:l,value:v,color:gcolor(s.group)})))}</div>`).join('')}
  <div class="card"><div class="tbar"><h4 style="margin:0">Todos los recibos <span>${s.recs.length}</span></h4><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">${s.isMortgage?'<label style="font-size:13px;color:var(--text-2);display:flex;gap:6px;align-items:center"><input type="checkbox" id="fut"> Mostrar cuotas futuras</label>':''}<input id="q" type="search" placeholder="Buscar…"></div></div>
    <div class="tw"><table><thead><tr>${s.cols.map((c,i)=>`<th class="${colIsNum(s,i)?'num':''}">${esc(c)}</th>`).join('')}</tr></thead><tbody id="tb"></tbody></table></div></div>`;
  // tabla
  const rows=[...s.recs].reverse();
  const tb=document.getElementById('tb');
  const nextDate=st.next?.date;
  let showFut=!s.isMortgage,lastQ='';
  const draw=q=>{q=(lastQ=q||'').toLowerCase();
    tb.innerHTML=rows.filter(r=>(showFut||r.date<=TODAY||r.date===nextDate)).filter(r=>!q||r.cells.join(' ').toLowerCase().includes(q)).map(r=>{const fut=r.date>TODAY;
      return `<tr class="${fut?'future':''}">${r.cells.map((v,i)=>cellHTML(s,i,v,r.date===nextDate&&i===0)).join('')}</tr>`}).join('')||`<tr><td colspan="${s.cols.length}" class="empty">Sin resultados</td></tr>`};
  draw();document.getElementById('q').oninput=e=>draw(e.target.value);
  const fu=document.getElementById('fut');if(fu)fu.onchange=()=>{showFut=fu.checked;draw(lastQ)};
  // gráficos
  const c1=document.getElementById('c1');
  if(c1&&s.isMortgage){const ci=s.cols.findIndex(c=>/capital pendiente/i.test(c));
    lineChart(c1,s.recs.map(r=>({x:r.date,y:num(r.cells[ci])||0})),{split:TODAY,height:250})}
  else if(c1){
    let prevY=null;
    barChart(c1,st.past.map(r=>({value:r.amount,color:gcolor(s.group),
      tip:`${fdate(r.date)}<br><b>${eur.format(r.amount)}</b>${tipExtra(s,r)}`})),
      {color:gcolor(s.group),xtick:(p,i)=>{const y=st.past[i].date.slice(0,4);if(y!==prevY){prevY=y;return st.past.length>6?y:fdate(st.past[i].date)}return st.past.length<=6?fdate(st.past[i].date):null}});
  }
  const c2=document.getElementById('c2');
  if(c2)barChart(c2,years.map(y=>({value:st.byYear[y],color:gcolor(s.group),tip:`${y}<br><b>${eur.format(st.byYear[y])}</b>`})),{xtick:(p,i)=>years[i],color:gcolor(s.group)});
  const c3=document.getElementById('c3');
  if(c3){const unit=(s.cols[s.consIdx].match(/(m3|kwh)/i)||[''])[0];
    const pts=st.past.map(r=>({x:r.date,y:num(r.cells[s.consIdx])})).filter(p=>p.y!=null);
    lineChart(c3,pts,{color:'var(--s1)',fmtY:v=>nf.format(v),fmtTip:p=>`${fdate(p.x)}<br><b>${nf.format(p.y)} ${unit}</b>`});}
}
function colIsNum(s,i){const v=s.recs.map(r=>r.cells[i]).filter(v=>v!=null&&v!=='');return v.length&&v.every(x=>typeof x==='number')&&!/fecha/i.test(s.cols[i])}
function isMoneyCol(s,i){return i===s.amtIdx||/precio|importe|cuota|inter[eé]s|capital|amortiz/i.test(s.cols[i])&&!/n[uú]mero/i.test(s.cols[i])}
function cellHTML(s,i,v,isNext){
  if(v==null||v==='')return '<td></td>';
  if(/fecha/i.test(s.cols[i]))return `<td>${fdate(toISO(v)||String(v))}${isNext?'<span class="badge">Próximo</span>':''}</td>`;
  if(typeof v==='number'){
    if(isMoneyCol(s,i))return `<td class="num ${i===s.amtIdx?'amt':''}">${eur.format(v)}</td>`;
    return `<td class="num">${nf.format(v)}</td>`;}
  const str=String(v);return `<td class="${str.length>40?'wrap':''}">${esc(str)}</td>`;
}
function tipExtra(s,r){
  const out=[];s.cols.forEach((c,i)=>{if(i===0||i===s.amtIdx||/^cuenta$/i.test(c))return;const v=r.cells[i];if(v==null||v==='')return;
    let t=typeof v==='number'?nf.format(v):String(v);if(t.length>60)t=t.slice(0,57)+'…';out.push(`<span style="opacity:.75">${esc(c)}:</span> ${esc(t)}`)});
  return out.length?'<br>'+out.slice(0,4).join('<br>'):'';
}

/* ---------------- Carga de datos ---------------- */
function loadScript(src){return new Promise((ok,ko)=>{if(window.XLSX)return ok();const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=()=>ko(new Error('no se pudo cargar SheetJS'));document.head.appendChild(sc)})}
async function fetchLive(){
  await loadScript(SHEETJS);
  const res=await fetch(GOOGLE_XLSX_URL,{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const wb=XLSX.read(await res.arrayBuffer(),{type:'array'});
  return wb.SheetNames.map(n=>({name:n,rows:XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null,blankrows:true})}));
}
async function load(){
  let raw=null;
  if(GOOGLE_XLSX_URL){
    try{raw=await fetchLive();SOURCE={kind:'live',when:new Date().toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'})}}
    catch(e){SOURCE={kind:'error',err:e.message}}
  }
  if(!raw){raw=SNAPSHOT?.sheets||[];if(SOURCE.kind!=='error')SOURCE={kind:'snapshot'}}
  SHEETS=raw.map(x=>parseSheet(x.name,x.rows)).filter(Boolean);
  SHEETS.forEach(s=>s.st=stats(s));
  document.getElementById('srcmini').textContent=SOURCE.kind==='live'?'En directo · Google Sheets':`Copia del ${fdate(SNAPSHOT?.generated)}`;
  if(!SHEETS.length){document.getElementById('main').innerHTML='<div class="empty">No hay datos que mostrar.</div>';return}
  route();
}
addEventListener('hashchange',route);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>RENDER&&RENDER(),150)});
load();
</script>
